services:

  db:
    image: registry.docker.ir/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kariko
      POSTGRES_USER: kariko
      POSTGRES_PASSWORD: kariko
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kariko -d kariko"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: registry.docker.ir/redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - ./config:/app/config:ro
      - ./apps:/app/apps:ro
      - ./tests:/app/tests:ro
      - ./conftest.py:/app/conftest.py:ro
      - ./pytest.ini:/app/pytest.ini:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  media_files:
  static_files:
